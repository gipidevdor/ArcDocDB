name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'assets/**'
      - 'tools/pages/**'
      - 'Makefile'
      - '.gitignore'
      - '.github/actions/setup-sbcl/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'assets/**'
      - 'tools/pages/**'
      - 'Makefile'
      - '.gitignore'
      - '.github/actions/setup-sbcl/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the complete manual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://gipidevdor.github.io/ArcDocDB/' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sbcl
      - name: Build with Common Lisp Codex and check every published page
        run: make docs
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _build/site
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
